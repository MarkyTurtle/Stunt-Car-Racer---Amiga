# The enhanced game: build its disk on Windows and Linux (enhanced/tools/build_disk.py, as
# BUILDING.md describes), check its SHA-1, boot it in the emulator harness, and keep the disk as
# the run's artifact (downloadable from the run's page). The disk uses the loading picture and the
# helper block from original/, so changes there run it too.
# Then its performance (Linux): the telemetry build's disk, the check that the game still works
# when its code moves (enhanced/tools/reloc_test.py), the pictures it loads from its disk while it
# runs (enhanced/tools/test_pictures.py: original/build.py first, for another disk), and the race benchmark
# (enhanced/tools/bench.py) against enhanced/bench_baseline.json - its report on the run's
# summary page, the disk and the figures as the run's artifact.
name: enhanced

on:
  push:
    paths: ['enhanced/**', 'original/**', '.github/workflows/enhanced.yml', '.github/actions/**']
  pull_request:
    paths: ['enhanced/**', 'original/**', '.github/workflows/enhanced.yml', '.github/actions/**']
  workflow_dispatch:

env:
  # The disk's SHA-1. A change to the game, the helper block or the bootblock changes it: update
  # this line with the new SHA-1 (build_disk.py prints it).
  ADF_SHA1: d44a952c701af789b5588692fd607ac90ca44da5

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Python packages
        shell: bash
        run: |
          python -m pip install -r enhanced/requirements.txt > "$RUNNER_TEMP/pip.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/pip.log" | sed 's/^/::error::/'; exit 1; }
      - uses: ./.github/actions/vasm
      - name: Build the disk and check its SHA-1 (enhanced/tools/build_disk.py)
        run: python enhanced/tools/build_disk.py --check ${{ env.ADF_SHA1 }}
      - name: Boot it in the emulator harness (enhanced/tools/test_boot.py)
        run: python enhanced/tools/test_boot.py
      - name: The checkout is unchanged
        shell: bash
        run: |
          test -z "$(git status --porcelain)" || { git status --porcelain | sed 's/^/::error::changed by the build - /'; exit 1; }
      - uses: actions/upload-artifact@v5
        with:
          name: enhanced-disk-${{ matrix.os }}-py${{ matrix.python }}
          path: enhanced/build/scr.adf

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/vasm
      - name: Build the telemetry disk (enhanced/tools/build_disk.py --telemetry)
        run: python enhanced/tools/build_disk.py --telemetry
      - name: Build scremu (original/tools/scremu/build.sh)
        run: sh original/tools/scremu/build.sh
      - name: Build the original disk (another disk for test_pictures.py)
        run: python original/build.py
      - name: The game works with its code moved (enhanced/tools/reloc_test.py)
        run: python enhanced/tools/reloc_test.py
      - name: The pictures loaded from the disk (enhanced/tools/test_pictures.py)
        run: python enhanced/tools/test_pictures.py
      - name: The race benchmark (enhanced/tools/bench.py)
        run: |
          python enhanced/tools/bench.py --json bench.json --compare enhanced/bench_baseline.json | tee bench.txt
          { echo '### The race benchmark (scremu, against enhanced/bench_baseline.json)'; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The checkout is unchanged
        run: |
          mkdir -p "$RUNNER_TEMP/out"; mv bench.json bench.txt "$RUNNER_TEMP/out/"
          test -z "$(git status --porcelain)" || { git status --porcelain | sed 's/^/::error::changed by the build - /'; exit 1; }
      - uses: actions/upload-artifact@v5
        with:
          name: enhanced-telemetry
          path: |
            enhanced/build/scr_telemetry.adf
            ${{ runner.temp }}/out/bench.json
            ${{ runner.temp }}/out/bench.txt
