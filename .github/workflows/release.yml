# When a release is published on GitHub: build the enhanced disk from the release's tag, boot it in
# the emulator harness, and attach it to the release (StuntCarRacer_Enhanced_<tag>.adf), with the
# telemetry build's disk (StuntCarRacer_Enhanced_<tag>_telemetry.adf: enhanced/src/telemetry.i),
# so they no longer need uploading by hand. It can also be run by hand for an existing release (Actions ->
# release -> Run workflow, with the release's tag); a disk already attached under that name is
# replaced.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag (for example v1.0)
        required: true

permissions:
  contents: write                                     # to attach files to the release

jobs:
  disk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Python packages
        run: python -m pip install -r enhanced/requirements.txt
      - uses: ./.github/actions/vasm
      - name: Build the disk (enhanced/tools/build_disk.py)
        run: python enhanced/tools/build_disk.py
      - name: Boot it in the emulator harness (enhanced/tools/test_boot.py)
        run: python enhanced/tools/test_boot.py
      - name: Build the telemetry disk (enhanced/tools/build_disk.py --telemetry)
        run: python enhanced/tools/build_disk.py --telemetry
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp enhanced/build/scr.adf "StuntCarRacer_Enhanced_${TAG}.adf"
          cp enhanced/build/scr_telemetry.adf "StuntCarRacer_Enhanced_${TAG}_telemetry.adf"
          gh release upload "$TAG" "StuntCarRacer_Enhanced_${TAG}.adf" "StuntCarRacer_Enhanced_${TAG}_telemetry.adf" --clobber
