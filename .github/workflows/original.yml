# The original game: assemble its programs on Windows and Linux (original/build.py, as BUILDING.md
# describes), check them against the originals' SHA-1, rebuild the source disk (the "Turbo"
# release's ADF) and check its SHA-1, check that the disassembly configs still generate sources
# that reassemble byte-identical (original/tools/disasm/make.py), check that the names in
# original/tools/names.py are applied and change no byte (original/tools/annotate.py), and keep the rebuilt disk as the
# run's artifact (downloadable from the run's page).
name: original

on:
  push:
    paths: ['original/**', '.github/workflows/original.yml', '.github/actions/**']
  pull_request:
    paths: ['original/**', '.github/workflows/original.yml', '.github/actions/**']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Python packages
        shell: bash
        run: |
          python -m pip install -r original/requirements.txt > "$RUNNER_TEMP/pip.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/pip.log" | sed 's/^/::error::/'; exit 1; }
      - uses: ./.github/actions/vasm
      - name: Assemble, check and rebuild the disk (original/build.py)
        run: python original/build.py
      - name: The disassembly configs (original/tools/disasm/make.py)
        run: python original/tools/disasm/make.py
      - name: The names are applied (original/tools/annotate.py)
        run: python original/tools/annotate.py
      - name: The checkout is unchanged
        shell: bash
        run: |
          test -z "$(git status --porcelain)" || { git status --porcelain | sed 's/^/::error::changed by the build - /'; exit 1; }
      - uses: actions/upload-artifact@v5
        with:
          name: original-disk-${{ matrix.os }}-py${{ matrix.python }}
          path: original/build/scr_original.adf
